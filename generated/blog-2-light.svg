  <text class="b-title" x="22" y="52">GitLab fine-grained personal access tokens, one</text><text class="b-title" x="22" y="77">action at a time</text>
  <text class="b-desc" x="22" y="116">A GitLab fine-grained token holds a grant, not scopes: REST refuses outside</text><text class="b-desc" x="22" y="136">it, GraphQL answers null. I derive what each API action needs, ahead of time.</text>
